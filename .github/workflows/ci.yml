name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-lint-build:
    name: Test, lint and build
    # GitHub-hosted, not the self-hosted infra-vlan runner: this job only
    # tests and builds, so it needs nothing inside the platform network.
    # This repo is public, and public repos must never run on a
    # self-hosted runner (any fork PR could execute code on it).
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: npm install
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Hands off the build artifact (dist/api, dist/web) for whatever
      # consumes it next - packaging/deployment is downstream of this
      # repo, not part of it.
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ github.sha }}
          path: dist/

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-lint-build:
    name: Test, lint and build
    # GitHub-hosted, not the self-hosted infra-vlan runner: this job only
    # tests and builds, so it needs nothing inside the platform network.
    # This repo is public, and public repos must never run on a
    # self-hosted runner (any fork PR could execute code on it).
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: npm install
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Hands off the build artifact (dist/api, dist/web) for whatever
      # consumes it next - packaging/deployment is downstream of this
      # repo, not part of it.
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ github.sha }}
          path: dist/

      # Only on a real merge to main (not PRs) - lets whatever packages
      # this artifact into a running container know a new one exists,
      # without this repo knowing anything about what happens to it next
      # (no registry, no image name, no deploy mechanism named here).
      #
      # Mints a short-lived (~1h) installation token from the shared
      # "Delta Famiglia Platform CI" GitHub App instead of a long-lived
      # PAT - same pattern Cloudflare Pages' own GitHub App uses for its
      # repo access. The App is installed on just this repo + curator,
      # with Contents: write there (what repository_dispatch needs) and
      # nothing else; PLATFORM_APP_ID/PLATFORM_APP_PRIVATE_KEY are this
      # repo's copy of that App's credentials (Settings > Secrets and
      # variables > Actions) - the App itself, and its installation on
      # both repos, is a one-time setup step in the GitHub org UI, not
      # something this workflow creates.
      - uses: actions/create-github-app-token@v2
        if: github.event_name == 'push'
        id: platform-app-token
        with:
          app-id: ${{ secrets.PLATFORM_APP_ID }}
          private-key: ${{ secrets.PLATFORM_APP_PRIVATE_KEY }}
          owner: deltafamiglia
          repositories: curator

      - name: Notify platform of new build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ steps.platform-app-token.outputs.token }}
        run: |
          gh api repos/deltafamiglia/curator/dispatches \
            -f event_type=demo-build \
            -f "client_payload[repo]=${{ github.repository }}" \
            -f "client_payload[sha]=${{ github.sha }}" \
            -f "client_payload[run_id]=${{ github.run_id }}"

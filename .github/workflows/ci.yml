name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-lint-build:
    name: Test, lint and build
    runs-on: [self-hosted, infra-vlan]
    # actions/setup-node's downloaded binary doesn't run on this runner's
    # host (glibc mismatch), so the job runs inside node:26-slim instead.
    container: node:26-slim

    steps:
      # node:26-slim has neither git nor ca-certificates - actions/checkout
      # needs the former on PATH before it can run, and the latter for its
      # https fetch from github.com to succeed.
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v7

      - name: npm install
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Hands off the build artifact (dist/api, dist/web) for whatever
      # consumes it next - packaging/deployment is downstream of this
      # repo, not part of it.
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/
